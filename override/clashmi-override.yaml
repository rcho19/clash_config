# Clash Mi / Mihomo 自定义覆写片段
#
# 职责边界：
# - Clash Mi 内置覆写负责 TUN（启用、协议栈、DNS 劫持、严格路由等平台参数）。
# - 本文件只负责 DNS、嗅探、代理组与分流，不包含节点凭据，也不声明 tun。
# - 订阅中只保留一条自建 LAX 节点时，PROXY 会自动收录并统一承载代理流量。

mode: rule
allow-lan: false
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat

profile:
  store-selected: true
  store-fake-ip: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443

# 不硬编码节点名，避免订阅重命名节点后失效。
proxy-groups:
  - name: PROXY
    type: select
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true

  # 全局模式与规则模式共用同一出口，避免 DNS 经 GLOBAL、流量经 PROXY 的分裂。
  - name: GLOBAL
    type: select
    proxies:
      - PROXY

dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - localhost.ptlogin2.qq.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - time-ios.apple.com
    - "+.pool.ntp.org"
    - geosite:private
    - geosite:category-ntp
    - geosite:connectivity-check
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://1.1.1.1/dns-query#PROXY"
    - "https://8.8.8.8/dns-query#PROXY"
  nameserver-policy:
    # Windows 连通性探测必须直连，否则系统可能误判为“无网络”。
    "+.msftconnecttest.com": &direct_dns
      - "https://dns.alidns.com/dns-query#DIRECT"
      - "https://doh.pub/dns-query#DIRECT"
    "+.msftncsi.com": *direct_dns
    "geosite:connectivity-check": *direct_dns
    "geosite:category-ntp": *direct_dns

    # 关键 Google / Antigravity / Microsoft 域名优先于中国区规则。
    "+.antigravity.google": &foreign_dns
      - "https://1.1.1.1/dns-query#PROXY"
      - "https://8.8.8.8/dns-query#PROXY"
    "+.google.com": *foreign_dns
    "+.googleapis.com": *foreign_dns
    "+.gstatic.com": *foreign_dns
    "+.googleusercontent.com": *foreign_dns
    "+.googlevideo.com": *foreign_dns
    "+.microsoft.com": *foreign_dns
    "+.microsoftonline.com": *foreign_dns
    "+.live.com": *foreign_dns
    "+.xboxlive.com": *foreign_dns
    "geosite:category-ai-!cn": *foreign_dns
    "geosite:google": *foreign_dns
    "geosite:microsoft": *foreign_dns
    "geosite:telegram": *foreign_dns
    "geosite:gfw": *foreign_dns

    # 只有明确需要直连的域名才使用国内 DoH；其他域名默认通过 PROXY 解析。
    "+.cn": *direct_dns
    "geosite:private": *direct_dns
    "geosite:cn": *direct_dns
    "geosite:synology": *direct_dns
    "geosite:category-game-platforms-download@cn": *direct_dns
  proxy-server-nameserver:
    - "https://doh.pub/dns-query#DIRECT"
    - "https://dns.alidns.com/dns-query#DIRECT"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query#DIRECT"
    - "https://doh.pub/dns-query#DIRECT"
  direct-nameserver-follow-policy: false

hosts:
  dns.alidns.com:
    - 223.5.5.5
    - 223.6.6.6
  doh.pub:
    - 1.12.12.12
    - 120.53.53.53

rules:
  # 局域网和 Windows 联网状态探测保持直连。
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,msftconnecttest.com,DIRECT
  - DOMAIN-SUFFIX,msftncsi.com,DIRECT
  - GEOSITE,connectivity-check,DIRECT

  # TUN + strict-route 是防旁路的主防线；再阻断常见 STUN/TURN UDP 端口。
  # 不使用 DOMAIN-KEYWORD,stun/turn，避免误伤包含这些普通字符串的域名。
  - AND,((NETWORK,UDP),(DST-PORT,3478)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,5349)),REJECT
  - AND,((NETWORK,UDP),(DST-PORT,19302)),REJECT
  # 默认保留 UDP 443/QUIC；如 TCP 型节点导致 HTTP/3 反复失败，可启用下一行。
  # - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # Antigravity、Google 与 Microsoft 全部使用 LAX，且先于中国区规则匹配。
  - DOMAIN-SUFFIX,antigravity.google,PROXY
  - DOMAIN-SUFFIX,google.com,PROXY
  - DOMAIN-SUFFIX,googleapis.com,PROXY
  - DOMAIN-SUFFIX,gstatic.com,PROXY
  - DOMAIN-SUFFIX,googleusercontent.com,PROXY
