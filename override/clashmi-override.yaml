  - DOMAIN-SUFFIX,live.com,PROXY
  - DOMAIN-SUFFIX,xboxlive.com,PROXY
  - GEOSITE,microsoft,PROXY

  - GEOSITE,synology,DIRECT
  - GEOSITE,category-game-platforms-download@cn,DIRECT

